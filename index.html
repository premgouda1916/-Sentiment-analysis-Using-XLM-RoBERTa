<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kannada Emotion Classifier (Serverless)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 30px;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 2.2rem;
      background: linear-gradient(to right, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      font-weight: 800;
    }
    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 1rem;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      font-weight: 600;
      color: #cbd5e1;
      font-size: 0.9rem;
      display: block;
      margin-bottom: 8px;
    }
    textarea, input[type="text"] {
      width: 100%;
      border-radius: 12px;
      border: 1px solid #334155;
      background: rgba(15, 23, 42, 0.6);
      color: #fff;
      padding: 12px;
      font-size: 15px;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }
    textarea:focus, input[type="text"]:focus {
      outline: none;
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2);
    }
    textarea {
      resize: vertical;
      min-height: 110px;
    }
    .token-info {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 4px;
      display: block;
    }
    .token-info a {
      color: #818cf8;
      text-decoration: none;
    }
    .token-info a:hover {
      text-decoration: underline;
    }
    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }
    button {
      flex: 1;
      border-radius: 12px;
      border: none;
      padding: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    #predictBtn {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #fff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    #predictBtn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    #predictBtn:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    #clearBtn {
      background: #334155;
      color: #cbd5e1;
    }
    #clearBtn:hover {
      background: #475569;
    }
    .loading {
      display: none;
      margin-top: 20px;
      text-align: center;
      color: #a855f7;
      font-weight: 600;
      font-size: 1rem;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .error {
      display: none;
      margin-top: 20px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      font-size: 0.95rem;
    }
    .result {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-left: 5px solid #818cf8;
    }
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .emotion-tag {
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: 0.05em;
    }
    .joy { color: #f59e0b; text-shadow: 0 0 10px rgba(245, 158, 11, 0.2); }
    .anger { color: #ef4444; text-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
    .sadness { color: #3b82f6; text-shadow: 0 0 10px rgba(59, 130, 246, 0.2); }
    .fear { color: #a855f7; text-shadow: 0 0 10px rgba(168, 85, 247, 0.2); }
    .neutral { color: #94a3b8; text-shadow: 0 0 10px rgba(148, 163, 184, 0.2); }
    
    .status-line {
      color: #94a3b8;
      font-size: 0.9rem;
    }
    .bar {
      margin: 14px 0;
      height: 20px;
      border-radius: 10px;
      background: #1e293b;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: bold;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .details {
      margin-top: 14px;
      font-size: 0.9rem;
      color: #cbd5e1;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 14px;
    }
    .details-row {
      display: flex;
      margin-bottom: 6px;
    }
    .details-row strong {
      width: 100px;
      color: #94a3b8;
    }
    .top3-title {
      font-weight: 700;
      margin: 14px 0 8px;
      font-size: 0.95rem;
      color: #94a3b8;
    }
    .top3-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .top3-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 12px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 8px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Kannada Emotion Classifier</h1>
    <div class="subtitle">Powered by Fine-tuned XLM-RoBERTa Serverless API</div>

    <div class="form-group">
      <label for="tokenInput">Hugging Face Access Token (Optional):</label>
      <input type="text" id="tokenInput" placeholder="hf_..." />
      <span class="token-info">
        Optional but recommended to avoid rate limits. Get a free token from your 
        <a href="https://huggingface.co/settings/tokens" target="_blank">HF Token Settings</a>.
      </span>
    </div>

    <div class="form-group">
      <label for="textInput">Sentence (Kannada):</label>
      <textarea id="textInput" placeholder="ಉದಾಹರಣೆ: ನನಗೆ ತುಂಬಾ ಸಂತೋಷವಾಗಿದೆ..."></textarea>
    </div>

    <div class="buttons">
      <button id="predictBtn">Analyze</button>
      <button id="clearBtn">Clear</button>
    </div>

    <div id="loading" class="loading">Sending request to Hugging Face Serverless API...</div>
    <div id="errorBox" class="error"></div>

    <div id="resultBox" class="result">
      <div class="result-header">
        <div class="emotion-tag" id="emotionTag">NEUTRAL</div>
        <div class="status-line" id="statusLine">Prediction successful</div>
      </div>
      <div class="bar">
        <div id="barFill" class="bar-fill">0%</div>
      </div>
      <div class="details">
        <div class="details-row">
          <strong>Input:</strong> <span id="origText"></span>
        </div>
      </div>
      <div>
        <div class="top3-title">Emotion Distribution:</div>
        <div id="top3" class="top3-list"></div>
      </div>
    </div>
  </div>

  <script>
    const textInput = document.getElementById('textInput');
    const tokenInput = document.getElementById('tokenInput');
    const predictBtn = document.getElementById('predictBtn');
    const clearBtn = document.getElementById('clearBtn');
    const loading = document.getElementById('loading');
    const errorBox = document.getElementById('errorBox');
    const resultBox = document.getElementById('resultBox');
    const emotionTag = document.getElementById('emotionTag');
    const statusLine = document.getElementById('statusLine');
    const barFill = document.getElementById('barFill');
    const origText = document.getElementById('origText');
    const top3 = document.getElementById('top3');

    // Retrieve saved token from localStorage if available
    if (localStorage.getItem('hf_token')) {
      tokenInput.value = localStorage.getItem('hf_token');
    }

    predictBtn.onclick = () => doPredict();
    clearBtn.onclick = () => {
      textInput.value = '';
      resultBox.style.display = 'none';
      errorBox.style.display = 'none';
    };

    async function doPredict() {
      const text = textInput.value.trim();
      if (!text) {
        showError('Please enter some text.');
        return;
      }

      setLoading(true);
      hideError();
      resultBox.style.display = 'none';

      // Save token locally for convenience
      const token = tokenInput.value.trim();
      if (token) {
        localStorage.setItem('hf_token', token);
      } else {
        localStorage.removeItem('hf_token');
      }

      try {
        const headers = { 'Content-Type': 'application/json' };
        if (token) {
          headers['Authorization'] = `Bearer ${token}`;
        }

        const modelUrl = 'https://api-inference.huggingface.co/models/premgouda1916/kannada-sentiment-classifier-Xlm_RoBERTa';
        const res = await fetch(modelUrl, {
          method: 'POST',
          headers: headers,
          body: JSON.stringify({ inputs: text })
        });

        const data = await res.json();

        // If the model is loading, Hugging Face returns an estimated time to load
        if (data.error && data.estimated_time) {
          showError(`Model is currently loading on Hugging Face servers. Estimated wait time: ${Math.round(data.estimated_time)} seconds. Please try again in a bit.`);
          return;
        }

        if (data.error) {
          throw new Error(data.error);
        }

        // HF Text Classification API returns array of array of predictions: [[{label, score}, ...]]
        if (!Array.isArray(data) || data.length === 0 || !Array.isArray(data[0])) {
          throw new Error('Invalid response format from API');
        }

        showResult(text, data[0]);
      } catch (err) {
        showError('API Error: ' + err.message);
      } finally {
        setLoading(false);
      }
    }

    function setLoading(on) {
      loading.style.display = on ? 'block' : 'none';
      predictBtn.disabled = on;
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
      resultBox.style.display = 'none';
    }

    function hideError() {
      errorBox.style.display = 'none';
    }

    function showResult(originalText, predictions) {
      // Sort predictions descending by score
      predictions.sort((a, b) => b.score - a.score);

      const topPred = predictions[0];
      const label = topPred.label.toLowerCase();
      
      emotionTag.textContent = label.toUpperCase();
      emotionTag.className = 'emotion-tag ' + label;

      const confPct = Math.round(topPred.score * 100);
      barFill.style.width = '0%';
      barFill.textContent = '0%';
      setTimeout(() => {
        barFill.style.width = confPct + '%';
        barFill.textContent = confPct + '%';
      }, 50);

      statusLine.textContent = topPred.score < 0.60
        ? 'Low confidence prediction'
        : 'Prediction successful';

      origText.textContent = originalText;

      top3.innerHTML = '';
      predictions.slice(0, 3).forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'top3-item';
        const pct = Math.round(item.score * 100);
        div.innerHTML = `<span>#${i + 1}: ${item.label.toUpperCase()}</span><span>${pct}%</span>`;
        top3.appendChild(div);
      });

      resultBox.style.display = 'block';
    }
  </script>
</body>
</html>
