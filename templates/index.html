<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kannada Emotion Classifier</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin:0;
      min-height:100vh;
      background:linear-gradient(135deg,#667eea,#764ba2);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      background:#fff;
      border-radius:18px;
      padding:24px 26px 26px;
      max-width:680px;
      width:100%;
      box-shadow:0 20px 45px rgba(0,0,0,0.25);
    }
    h1 {
      margin:0 0 6px;
      font-size:2.1rem;
      color:#4f46e5;
      text-align:center;
    }
    .subtitle {
      text-align:center;
      color:#6b7280;
      font-size:0.95rem;
      margin-bottom:18px;
    }
    label {
      font-weight:600;
      color:#374151;
      font-size:0.95rem;
      display:block;
      margin-bottom:6px;
    }
    textarea {
      width:100%;
      border-radius:10px;
      border:2px solid #e5e7eb;
      padding:10px 11px;
      resize:vertical;
      min-height:100px;
      font-size:15px;
    }
    textarea:focus {
      outline:none;
      border-color:#4f46e5;
    }
    .buttons {
      display:flex;
      gap:10px;
      margin-top:10px;
    }
    button {
      flex:1;
      border-radius:10px;
      border:none;
      padding:10px;
      font-weight:600;
      cursor:pointer;
    }
    #predictBtn {
      background:linear-gradient(135deg,#667eea,#764ba2);
      color:#fff;
    }
    #predictBtn:disabled {
      background:#9ca3af;
      cursor:not-allowed;
    }
    #clearBtn {
      background:#f3f4f6;
      color:#111827;
      border:1px solid #e5e7eb;
    }
    .loading {
      display:none;
      margin-top:14px;
      text-align:center;
      color:#4f46e5;
      font-size:0.9rem;
    }
    .error {
      display:none;
      margin-top:14px;
      padding:10px;
      border-radius:10px;
      background:#fee2e2;
      color:#b91c1c;
      font-size:0.9rem;
    }
    .result {
      display:none;
      margin-top:14px;
      padding:12px;
      border-radius:12px;
      background:#f9fafb;
      border-left:4px solid #4f46e5;
      font-size:0.9rem;
    }
    .emotion-tag {
      font-weight:700;
      font-size:1.2rem;
      margin-bottom:4px;
    }
    .joy { color:#f59e0b; }
    .anger { color:#ef4444; }
    .sadness { color:#3b82f6; }
    .fear { color:#fb923c; }
    .neutral { color:#4b5563; }
    .uncertain { color:#9ca3af; }
    .bar {
      margin-top:6px;
      height:22px;
      border-radius:999px;
      background:#e5e7eb;
      overflow:hidden;
    }
    .bar-fill {
      width:0%;
      height:100%;
      background:linear-gradient(90deg,#667eea,#764ba2);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:0.8rem;
      transition:width .4s ease;
    }
    .top3-item {
      display:flex;
      justify-content:space-between;
      padding:2px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Kannada Emotion Classifier</h1>
    <div class="subtitle">Enter a Kannada sentence to detect its emotion.</div>

    <label for="textInput">Sentence (Kannada):</label>
    <textarea id="textInput" placeholder="ಉದಾಹರಣೆ: ನನಗೆ ತುಂಬಾ ಸಂತೋಷವಾಗಿದೆ..."></textarea>

    <div class="buttons">
      <button id="predictBtn">Analyze</button>
      <button id="clearBtn">Clear</button>
    </div>

    <div id="loading" class="loading">Analyzing...</div>
    <div id="errorBox" class="error"></div>

    <div id="resultBox" class="result">
      <div class="emotion-tag" id="emotionTag">NEUTRAL</div>
      <div id="statusLine"></div>
      <div class="bar">
        <div id="barFill" class="bar-fill">0%</div>
      </div>
      <div style="margin-top:8px;">
        <strong>Input:</strong> <span id="origText"></span>
      </div>
      <div>
        <strong>Cleaned:</strong> <span id="cleanText"></span>
      </div>
      <div style="margin-top:6px;">
        <strong>Top predictions:</strong>
        <div id="top3"></div>
      </div>
    </div>
  </div>

  <script>
    const textInput = document.getElementById('textInput');
    const predictBtn = document.getElementById('predictBtn');
    const clearBtn = document.getElementById('clearBtn');
    const loading = document.getElementById('loading');
    const errorBox = document.getElementById('errorBox');
    const resultBox = document.getElementById('resultBox');
    const emotionTag = document.getElementById('emotionTag');
    const statusLine = document.getElementById('statusLine');
    const barFill = document.getElementById('barFill');
    const origText = document.getElementById('origText');
    const cleanText = document.getElementById('cleanText');
    const top3 = document.getElementById('top3');

    predictBtn.onclick = () => doPredict();
    clearBtn.onclick = () => {
      textInput.value = '';
      resultBox.style.display = 'none';
      errorBox.style.display = 'none';
    };

    async function doPredict() {
      const text = textInput.value.trim();
      if (!text) {
        showError('Please enter some text.');
        return;
      }

      setLoading(true);
      hideError();
      resultBox.style.display = 'none';

      try {
        const res = await fetch('/predict', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ text })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Server error');
        showResult(data);
      } catch (err) {
        showError(err.message);
      } finally {
        setLoading(false);
      }
    }

    function setLoading(on) {
      loading.style.display = on ? 'block' : 'none';
      predictBtn.disabled = on;
    }
    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
      resultBox.style.display = 'none';
    }
    function hideError() {
      errorBox.style.display = 'none';
    }

    function showResult(data) {
      const label = (data.predicted_emotion || 'uncertain').toLowerCase();
      emotionTag.textContent = label.toUpperCase();
      emotionTag.className = 'emotion-tag ' + label;

      const confPct = Math.round((data.confidence_raw || 0) * 100);
      barFill.style.width = '0%';
      barFill.textContent = '0%';
      setTimeout(() => {
        barFill.style.width = confPct + '%';
        barFill.textContent = confPct + '%';
      }, 50);

      statusLine.textContent = data.low_confidence
        ? `Low confidence (threshold ${(data.threshold || '60%')})`
        : 'Prediction successful';

      origText.textContent = data.original_sentence || '';
      cleanText.textContent = data.cleaned_sentence || '';

      top3.innerHTML = '';
      (data.top_3_predictions || []).forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'top3-item';
        const pct = Math.round((item.score || 0) * 100);
        div.innerHTML = `<span>#${i + 1}: ${item.emotion.toUpperCase()}</span><span>${pct}%</span>`;
        top3.appendChild(div);
      });

      resultBox.style.display = 'block';
    }
  </script>
</body>
</html>
